name: Push

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --release --locked
      - run: python3 scripts/figures.py target/release/gfa-to-tabix --check
      - run: python3 scripts/check-links.py
      - run: python3 scripts/check-claims.py
      - run: scripts/check-walks.sh target/release/gfa-to-tabix

  parity:
    name: Byte parity with the JBrowse scripts and bandage-fold
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GMOD/jbrowse-components
          ref: c87a58557c2a74b6b770f34994350b69e842ace9
          path: jbrowse
          sparse-checkout: scripts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lh3/gfatools
          ref: 39c54d5dfe4678d4cfb75b37bd27d4fb21f4de72
          path: gfatools
      - run: sudo apt-get install -y tabix gawk zlib1g-dev
      - run: make -C gfatools && echo "$PWD/gfatools" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-parity-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked
      - run: scripts/parity-fixtures.sh jbrowse/scripts target/release/gfa-to-tabix
      - run: scripts/parity-fold.sh target/release/gfa-to-tabix

  rebuild:
    name: graph-walks rebuilds every path from the fixtures' walk files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GMOD/graph-walks
          ref: c0d8a2335950132b89d71f2b3f960ea97ad21b96
          path: graph-walks
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: graph-walks/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: graph-walks/pnpm-lock.yaml
      - run: pnpm --dir graph-walks install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-rebuild-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo build --release --locked
      - run: scripts/graph-walks-rebuild.mjs graph-walks target/release/gfa-to-tabix
